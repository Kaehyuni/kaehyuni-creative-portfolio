name: Import portfolio source

on:
  push:
    branches:
      - main
    paths:
      - repo-upload.zip

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack portfolio
        run: unzip -o repo-upload.zip -d .
      - name: Commit imported source
        run: |
          rm -f repo-upload.zip .bootstrap .github/workflows/import-portfolio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import portfolio source"
          git push
